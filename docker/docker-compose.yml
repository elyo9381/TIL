services:
  mysql:
    image: mysql:8.0
    container_name: mysql-tx-lab
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tx_lab
    ports:
      - "3307:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --transaction-isolation=READ-COMMITTED
